services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: snakepro
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: snakepro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snakepro -d snakepro"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://snakepro:password123@db:5432/snakepro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
